<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game - Boss Level</title>
<style>
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: rgba(0,0,0,0.3); padding: 30px; border-radius: 20px; }
    select, input, button { padding: 10px; margin: 5px; border-radius: 10px; border: none; font-size: 16px; width: 90%; }
    button { background: #ff6b6b; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff5252; }
    #timer { font-size: 20px; color: #ffd93d; font-weight: bold; }
    #message { margin-top: 15px; font-size: 18px; }
    .boss { color: gold; font-size: 24px; animation: glow 1s infinite; }
    @keyframes glow { 0%{text-shadow:0 0 5px gold} 100%{text-shadow:0 0 20px gold} }
</style>
</head>
<body>
<div class="container">
    <h1>🎯 Number Guess Pro</h1>
    
    <label for="level">Level Select:</label>
    <select id="level" onchange="startGame()"></select>

    <p id="timer"></p>
    <p>Try: <span id="try">0</span></p>
    
    <input type="number" id="guess" placeholder="Number dao">
    <button onclick="checkGuess()">Guess</button>
    <button onclick="startGame()">Abar Khelbo</button>
    
    <p id="message"></p>
</div>

<script>
let randomNumber, tryCount, timer, timeLeft, maxNumber;
let gameWon = localStorage.getItem("gameWon") === "true";

const levels = [
    {level: 1, max: 50, time: 0},
    {level: 2, max: 100, time: 0},
    {level: 3, max: 500, time: 15},
    {level: 4, max: 1000, time: 30},
    {level: 5, max: 1200, time: 35},
    {level: 6, max: 1500, time: 40},
    {level: 7, max: 2000, time: 45}, // Boss Level
{level: 8, name: "ENDLESS MODE 🔥", max: 9999, time: 0} // Unlock hobe
];

levels.forEach((l, index) => {
    if(l.level <= 8 || gameWon){ // Level 8 sudhu win korle dekhabe
        let option = document.createElement('option');
        option.value = index;
        option.innerText = l.name ? l.name : `Level ${l.level}: 1-${l.max} ${l.time > 0 ? '⏰' : ''}`;
        document.getElementById('level').appendChild(option);
    }
});

function startGame() {
    let idx = parseInt(document.getElementById('level').value);
    let currentLevel = levels[idx];
    maxNumber = currentLevel.max;
    randomNumber = Math.floor(Math.random() * maxNumber) + 1;
    tryCount = 0;
    document.getElementById('try').innerText = 0;
    document.getElementById('message').innerText = `New game! 1 theke ${maxNumber} er moddhe`;
    clearInterval(timer);
    
    if(currentLevel.time > 0) {
        timeLeft = currentLevel.time;
        document.getElementById('timer').innerText = "Time: " + timeLeft + "s";
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = "Time: " + timeLeft + "s";
            if(timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById('message').innerText = `😭 Time sesh! Number chilo: ${randomNumber}`;
                document.getElementById('guess').disabled = true;
            }
        }, 1000);
    } else {
        document.getElementById('timer').innerText = "";
    }
    document.getElementById('guess').disabled = false;
}

function checkGuess() {
    let guess = parseInt(document.getElementById('guess').value);
    if(!guess) return;
    tryCount++;
    document.getElementById('try').innerText = tryCount;
    
    if(guess === randomNumber) {
        clearInterval(timer);
        let idx = parseInt(document.getElementById('level').value);
        
        if(idx === 6){ // Level 7 win korle
            gameWon = true;
            localStorage.setItem("gameWon", "true");
            document.getElementById('message').innerHTML = `<span class="boss">👑 TUI BOSS! 👑</span><br> Level 7 complete! ENDLESS MODE unlock hoyeche 🔥`;
            setTimeout(()=> location.reload(), 2000);
        } else if(idx === 7){ // ENDLESS MODE win korle
            document.getElementById('message').innerHTML = `<span class="boss">Tumi sob level sesh korecho 👑</span>`;
        } else { // Baki sob level win korle
            document.getElementById('message').innerText = `🎉 Thik dhorechis ${randomNumber}! Try: ${tryCount}`;
        }
        document.getElementById('guess').disabled = true;
    }
    
    } else if(guess < randomNumber) {
        document.getElementById('message').innerText = "⬆️ Boro number bolo";
    } else {
        document.getElementById('message').innerText = "⬇️ Choto number bolo";
    }
    document.getElementById('guess').value = "";
}
startGame();
</script>
</body>
    </html>
