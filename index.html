<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game 👾</title>
<style>
    body {
        background: #0d0d0d;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        background: #1a1a1a;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 0 20px #a855f7;
        width: 90%;
        max-width: 400px;
    }
    h1 { color: #a855f7; margin-bottom: 10px; }
    input {
        padding: 12px;
        width: 60%;
        border-radius: 8px;
        border: 2px solid #a855f7;
        background: #333;
        color: white;
        font-size: 16px;
        margin: 10px 0;
    }
    button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
        font-weight: bold;
    }
    button:hover { background: #16a34a; }
    #restartBtn { background: #3b82f6; display: none; }
    #restartBtn:hover { background: #2563eb; }
    .hint { color: #38bdf8; margin-top: 15px; font-weight: bold; font-size: 18px; }
    .score { color: #facc15; margin-top: 15px; font-size: 16px; }
    .win {
        font-size: 22px;
        color: #22c55e;
        animation: pop 0.5s ease;
    }
    @keyframes pop {
        0% { transform: scale(0.5); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>
<div class="container">
    <h1>👾 Number Guessing Game</h1>
    <p>1 theke 100 er moddhe ekta number guess kor</p>
    <input type="number" id="guessInput" placeholder="Number likh" min="1" max="100">
    <br>
    <button onclick="checkGuess()">Guess</button>
    <button id="restartBtn" onclick="restartGame()">Abar Khelbo</button>
    <p class="hint" id="hint"></p>
    <p class="score" id="score">Try: 0</p>
</div>

<script>
    let secretNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    function checkGuess() {
        let guess = Number(document.getElementById('guessInput').value);
        let hint = document.getElementById('hint');
        
        if(guess < 1 || guess > 100) {
            hint.innerText = "1 theke 100 er moddhe number de bos!";
            return;
        }

        attempts++;
        document.getElementById('score').innerText = `Try: ${attempts}`;

        if (guess === secretNumber) {
            hint.innerHTML = `🎉 Dhur beta! Thik dhorechis ${secretNumber} ! 🎉`;
            hint.className = "hint win";
            document.getElementById('restartBtn').style.display = "inline-block";
            document.querySelector('button[onclick="checkGuess()"]').disabled = true;
        } else if (guess < secretNumber) {
            hint.innerText = "📈 Beshi kor! Number ta aro boro";
            hint.className = "hint";
        } else {
            hint.innerText = "📉 Kom kor! Number ta aro choto";
            hint.className = "hint";
        }
        document.getElementById('guessInput').value = "";
    }

    function restartGame() {
        secretNumber = Math.floor(Math.random() * 100) + 1;
        attempts = 0;
        document.getElementById('score').innerText = `Try: 0`;
        document.getElementById('hint').innerText = "";
        document.getElementById('restartBtn').style.display = "none";
        document.querySelector('button[onclick="checkGuess()"]').disabled = false;
    }

    // Enter chapleo kaj korbe
    document.getElementById('guessInput').addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkGuess();
        }
    });
</script>
</body>
</html>
