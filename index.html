<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #1a1a1a; color: white;}
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px;}
        button { background: #4CAF50; color: white; border: none; }
        #result { font-size: 20px; margin-top: 20px; font-weight: bold;}
    </style>
</head>
<body>
    <h1>👾 Number Guessing Game</h1>
    <p>1 theke 100 er moddhe ekta number guess kor</p>
    <input type="number" id="guessInput" placeholder="Number likh">
    <button onclick="checkGuess()">Guess</button>
    <p id="result"></p>
    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        function checkGuess() {
            let userGuess = document.getElementById("guessInput").value;
            attempts++;
            let resultText = document.getElementById("result");
            if(userGuess == secretNumber) {
                resultText.innerText = "🔥 Congrats! " + attempts + " bar e dhore felchis!";
                resultText.style.color = "lightgreen";
            } else if(userGuess < secretNumber) {
                resultText.innerText = "📈 Beshi kor! Number ta aro boro";
                resultText.style.color = "skyblue";
            } else {
                resultText.innerText = "📉 Kom kor! Number ta aro choto";
                resultText.style.color = "tomato";
            }
        }
    </script>
</body>
  </html>
